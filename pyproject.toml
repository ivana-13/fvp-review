[project]
name = "fvp"
version = "0.1.0"
description = "Foils versus pointing: do compositional benchmarks measure role binding? (Idea A trial)"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "torchvision",
    "transformers>=4.57",
    "accelerate",
    "pillow",
    "requests",
    "remotezip",
    "tqdm",
    "pytest",
    "scikit-learn>=1.9.0",
    "nltk>=3.10.3",
    "bitsandbytes>=0.50.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["fvp", "fvp.models"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
